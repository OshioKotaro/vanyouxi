<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🐉 AI跑团 · 最终精简版</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f0e 0%, #1a1f1e 100%);
            font-family: -apple-system, 'Segoe UI', sans-serif;
            color: #e8e2d4;
            padding: 12px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0,0,0,0.6);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #c4a46e;
        }
        h1 { font-size: 1.3rem; margin: 0 0 12px 0; text-align: center; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 12px;
            padding: 5px 10px;
            background: #1a2a24;
            border-radius: 20px;
        }
        .panel {
            background: #0e1815cc;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #dbb86b; }
        input, select {
            width: 100%;
            background: #2c3b32;
            border: 1px solid #b48c48;
            padding: 10px;
            border-radius: 40px;
            color: #f2e5c6;
            font-size: 14px;
        }
        button {
            background: #7e6236;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            color: #fff0d4;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { background: #a47e42; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .room-code {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: #1a2a24;
            padding: 10px;
            border-radius: 16px;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
            min-height: 60px;
        }
        .player-card {
            background: #2a3b2c;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .player-card.ready { background: #4a6b3c; border: 1px solid #8bc34a; }
        .player-card.host { border: 1px solid gold; }
        .enemy-card {
            background: #2a221ab3;
            margin: 8px 0;
            padding: 8px 12px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
        }
        .combat-log {
            background: #030807;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 16px;
            font-size: 14px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, monospace;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        .combat-log p {
            margin: 6px 0;
            border-left: 3px solid #dba450;
            padding-left: 10px;
        }
        .ai-text { color: #f7e6b0; font-style: italic; }
        .action-text { color: #ffaa66; font-weight: 500; }
        .system-text { color: #ccc; font-size: 13px; }
        .damage-text { color: #ff8888; font-weight: bold; }
        .action-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        #actionInput {
            flex: 3;
            background: #1c2b25;
            border: 1px solid #c4a060;
            padding: 10px;
            border-radius: 40px;
            color: #f7efcf;
            font-size: 14px;
        }
        #actBtn { flex: 1; background: #9e6f3e; }
        .turn-indicator {
            background: #7e6236;
            padding: 8px;
            border-radius: 40px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .inventory-panel {
            background: #1e2a24;
            border-radius: 16px;
            padding: 8px;
            margin-top: 10px;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
        }
        .hidden { display: none; }
        hr { border-color: #5e6e45; margin: 12px 0; }
        .flex-row { display: flex; gap: 8px; }
        .flex-row button { width: auto; }
        .info-text { font-size: 12px; color: #aaa; margin-top: 5px; text-align: center; }
        .attr-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .attr-name { width: 60px; }
        .attr-value { width: 40px; text-align: center; }
        .attr-buttons { display: flex; gap: 5px; }
        .attr-buttons button { width: 30px; padding: 2px; }
        .points-left { font-weight: bold; color: gold; }
        .game-over {
            color: #ff6666;
            font-weight: bold;
            text-align: center;
            background: #330000;
            padding: 8px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🐉 AI跑团 · 最终精简版</h1>
    <div class="status-bar">
        <span id="syncStatus">🔄 连接中...</span>
        <span id="playerNameDisplay"></span>
    </div>
    
    <div id="loginPanel" class="panel">
        <h3>✨ 创建新角色</h3>
        <div class="form-group">
            <label>角色名</label>
            <input type="text" id="playerName" placeholder="输入名字" value="冒险者">
        </div>
        <div class="form-group">
            <label>职业</label>
            <select id="playerClass">
                <option value="战士">🗡️ 战士</option>
                <option value="法师">🔮 法师</option>
                <option value="游侠">🏹 游侠</option>
            </select>
        </div>
        <div id="attributePanel" style="margin-top: 12px;">
            <div style="font-size: 14px; margin-bottom: 8px;">📊 分配属性点（剩余 <span id="pointsLeft" class="points-left">20</span> 点）</div>
            <div class="attr-row"><span class="attr-name">💪 力量</span><span id="strVal" class="attr-value">10</span><div class="attr-buttons"><button data-attr="str" data-delta="1">+</button><button data-attr="str" data-delta="-1">-</button></div></div>
            <div class="attr-row"><span class="attr-name">🏹 敏捷</span><span id="dexVal" class="attr-value">10</span><div class="attr-buttons"><button data-attr="dex" data-delta="1">+</button><button data-attr="dex" data-delta="-1">-</button></div></div>
            <div class="attr-row"><span class="attr-name">🧠 智力</span><span id="intVal" class="attr-value">10</span><div class="attr-buttons"><button data-attr="int" data-delta="1">+</button><button data-attr="int" data-delta="-1">-</button></div></div>
            <div class="attr-row"><span class="attr-name">❤️ 体质</span><span id="conVal" class="attr-value">10</span><div class="attr-buttons"><button data-attr="con" data-delta="1">+</button><button data-attr="con" data-delta="-1">-</button></div></div>
        </div>
        <button id="createPlayerBtn" style="margin-top: 12px;">创建并进入大厅</button>
        <hr>
        <h3>🔑 恢复已有角色</h3>
        <div class="form-group">
            <label>角色ID</label>
            <input type="text" id="restoreId" placeholder="粘贴你的角色ID">
            <button id="restoreBtn" style="margin-top: 8px;">恢复角色</button>
        </div>
    </div>
    
    <div id="roomPanel" class="panel hidden">
        <div id="roomInfo"></div>
        <div class="player-list" id="roomPlayerList"></div>
        <div id="roomActions"></div>
        <hr>
        <div class="flex-row">
            <input type="text" id="joinRoomCode" placeholder="输入房间码">
            <button id="joinRoomBtn" style="width: auto;">加入</button>
        </div>
    </div>
    
    <div id="gamePanel" class="panel hidden">
        <div id="turnIndicator" class="turn-indicator">等待开始...</div>
        <div id="sceneDesc" style="font-size: 13px; margin-bottom: 10px;"></div>
        <div id="enemyContainer"></div>
        <div id="playerStats" style="margin-top: 10px; background: #00000066; border-radius: 16px; padding: 8px; font-size: 13px;"></div>
        <div id="inventoryPanel" class="inventory-panel">
            <span>📦 物品栏</span>
            <span id="itemsList"></span>
        </div>
        <div style="margin-top: 12px;">
            <div>📜 冒险记录</div>
            <div id="combatLog" class="combat-log"></div>
            <div class="action-area" id="actionArea">
                <input id="actionInput" placeholder="描述行动... (攻击/探索/对话/使用技能/使用物品)" autocomplete="off">
                <button id="actBtn">行动</button>
            </div>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://paotuan.xianzhi-hong.workers.dev";
    const GROQ_API_KEY = "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";  // 请填入你的 Groq API Key
    
    let currentPlayer = null;
    let currentRoom = null;
    let syncInterval = null;
    let gameActive = false;
    let gameOver = false;
    let lastMessageId = 0;
    let isActing = false;
    let displayedMessageIds = new Set();
    
    let pendingAttributes = { str: 10, dex: 10, int: 10, con: 10 };
    let pointsLeft = 20;
    
    const openingThemes = [
        "废弃神庙", "阴森墓地", "瘟疫村庄", "诅咒森林", "沉没神殿", "巫师高塔", "古战场遗迹", "黑暗沼泽", "冰封洞穴", "血色修道院"
    ];
    
    function updateAttributeUI() {
        document.getElementById("strVal").innerText = pendingAttributes.str;
        document.getElementById("dexVal").innerText = pendingAttributes.dex;
        document.getElementById("intVal").innerText = pendingAttributes.int;
        document.getElementById("conVal").innerText = pendingAttributes.con;
        document.getElementById("pointsLeft").innerText = pointsLeft;
        document.querySelectorAll("[data-delta='1']").forEach(btn => btn.disabled = pointsLeft === 0);
        document.querySelectorAll("[data-delta='-1']").forEach(btn => {
            const attr = btn.getAttribute("data-attr");
            btn.disabled = pendingAttributes[attr] === 10;
        });
    }
    
    function initAttributeControls() {
        document.querySelectorAll("[data-delta]").forEach(btn => {
            btn.addEventListener("click", () => {
                const attr = btn.getAttribute("data-attr");
                const delta = parseInt(btn.getAttribute("data-delta"));
                if (delta === 1 && pointsLeft === 0) return;
                if (delta === -1 && pendingAttributes[attr] === 10) return;
                pendingAttributes[attr] += delta;
                pointsLeft -= delta;
                updateAttributeUI();
            });
        });
        updateAttributeUI();
    }
    
    function showPanel(name) {
        document.getElementById("loginPanel").classList.add("hidden");
        document.getElementById("roomPanel").classList.add("hidden");
        document.getElementById("gamePanel").classList.add("hidden");
        document.getElementById(name + "Panel").classList.remove("hidden");
    }
    
    function clearLog() {
        const logDiv = document.getElementById("combatLog");
        if (logDiv) logDiv.innerHTML = "";
        displayedMessageIds.clear();
        lastMessageId = 0;
    }
    
    function addLog(content, type = "system", skipSync = false, messageId = null) {
        const logDiv = document.getElementById("combatLog");
        if (!logDiv) return;
        if (messageId && displayedMessageIds.has(messageId)) return;
        if (messageId) displayedMessageIds.add(messageId);
        const p = document.createElement("p");
        let cls = "";
        if (type === "ai") cls = "ai-text";
        else if (type === "action") cls = "action-text";
        else if (type === "damage") cls = "damage-text";
        else cls = "system-text";
        p.innerHTML = `<span class="${cls}">${content}</span>`;
        logDiv.appendChild(p);
        p.scrollIntoView({ behavior: "smooth", block: "nearest" });
        while (logDiv.children.length > 200) logDiv.removeChild(logDiv.firstChild);
        if (!skipSync && currentPlayer) {
            api("addMessage", { type, playerName: currentPlayer.name, content });
        }
    }
    
    async function api(action, data) {
        try {
            const res = await fetch(`${WORKER_URL}/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action, data })
            });
            return await res.json();
        } catch(e) {
            console.error("API错误:", e);
            return { success: false, error: e.message };
        }
    }
    
    function getLogHistory() {
        const logDiv = document.getElementById("combatLog");
        if (!logDiv) return [];
        return Array.from(logDiv.querySelectorAll("p")).slice(-20).map(p => {
            const text = p.innerText;
            const isAi = p.querySelector(".ai-text") !== null;
            const isAction = p.querySelector(".action-text") !== null;
            let type = "system";
            if (isAi) type = "ai";
            else if (isAction) type = "action";
            return { type, playerName: null, content: text };
        });
    }
    
    function updateInventoryUI() {
        if (!currentPlayer) return;
        const itemsDiv = document.getElementById("itemsList");
        if (!itemsDiv) return;
        let itemsText = "";
        if (currentPlayer.inventory && currentPlayer.inventory.length) {
            itemsText = currentPlayer.inventory.map(i => `${i.name}×${i.quantity}`).join(", ");
        } else {
            itemsText = "空";
        }
        itemsDiv.innerText = itemsText;
    }
    
    async function addItemToInventory(itemName, quantity = 1) {
        if (!currentPlayer) return false;
        if (!currentPlayer.inventory) currentPlayer.inventory = [];
        const existing = currentPlayer.inventory.find(i => i.name === itemName);
        if (existing) {
            existing.quantity += quantity;
        } else {
            currentPlayer.inventory.push({ name: itemName, quantity });
        }
        await api("updatePlayer", { playerId: currentPlayer.id, updates: { inventory: currentPlayer.inventory } });
        updateInventoryUI();
        addLog(`📦 获得 ${itemName} × ${quantity}，已加入物品栏。`, "system", false);
        return true;
    }
    
    function useItem(itemName) {
        if (!currentPlayer.inventory) return false;
        const item = currentPlayer.inventory.find(i => i.name.toLowerCase() === itemName.toLowerCase());
        if (!item || item.quantity <= 0) return false;
        if (itemName.toLowerCase() === "治疗药水") {
            const heal = 20;
            currentPlayer.hp = Math.min(currentPlayer.maxHp, currentPlayer.hp + heal);
            item.quantity--;
            if (item.quantity === 0) {
                currentPlayer.inventory = currentPlayer.inventory.filter(i => i.name !== itemName);
            }
            addLog(`💊 ${currentPlayer.name} 使用了治疗药水，恢复了 ${heal} HP。`, "system", false);
            updateInventoryUI();
            api("updatePlayer", { playerId: currentPlayer.id, updates: { hp: currentPlayer.hp, inventory: currentPlayer.inventory } });
            return true;
        }
        return false;
    }
    
    function useSkill(skillName) {
        if (!currentPlayer.skills) return false;
        const hasSkill = currentPlayer.skills.some(s => s.toLowerCase() === skillName.toLowerCase());
        if (!hasSkill) return false;
        let mpCost = 0;
        let damageBonus = 0;
        if (skillName.toLowerCase() === "破甲斩") { mpCost = 8; damageBonus = 10; }
        else if (skillName.toLowerCase() === "火球术") { mpCost = 10; damageBonus = 12; }
        else if (skillName.toLowerCase() === "精准射击") { mpCost = 6; damageBonus = 8; }
        else return false;
        if (currentPlayer.mp < mpCost) return false;
        currentPlayer.mp -= mpCost;
        api("updatePlayer", { playerId: currentPlayer.id, updates: { mp: currentPlayer.mp } });
        return { success: true, damageBonus, mpCost };
    }
    
    async function generateRandomOpening() {
        const theme = openingThemes[Math.floor(Math.random() * openingThemes.length)];
        const prompt = `生成一个黑暗奇幻/克苏鲁风格的开场场景，地点是“${theme}”。必须详细描述（80-120字）。描述玩家队伍到达此地的过程以及初步遇到的氛围。直接叙述。`;
        return await generateNarrative(prompt);
    }
    
    async function generateNarrative(prompt, extraContext = "") {
        const history = getLogHistory();
        const systemPrompt = "你是DND地下城主。直接描述结果，禁止输出选项、列表、'可能的结果'、'建议'或提问。剧情简洁直接，不绕弯子。";
        try {
            const res = await fetch(`${WORKER_URL}/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
                body: JSON.stringify({ 
                    action: "generateNarrative", 
                    data: { prompt, history, extraContext, systemPrompt } 
                })
            });
            const result = await res.json();
            return result.success ? result.text : prompt;
        } catch(e) {
            return "你环顾四周，没有特别的事情发生。";
        }
    }
    
    async function generateBattleDescription(playerName, playerClass, actionDesc, hitResult, damage, targetName, targetHP) {
        const systemPrompt = "直接描述战斗结果，不要给出选项或提问。";
        const prompt = `${playerName}(${playerClass}) ${actionDesc}，${hitResult ? "命中" : "未命中"}，造成${damage}伤害。${targetName}剩余HP ${targetHP}。`;
        try {
            const res = await fetch(`${WORKER_URL}/action`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
                body: JSON.stringify({ action: "generateBattleDesc", data: { playerName, playerClass, actionDesc, hitResult, damage, systemPrompt } })
            });
            const result = await res.json();
            return result.description || `${playerName}的攻击！`;
        } catch(e) {
            return `${playerName}的攻击！`;
        }
    }
    
    async function resetRoomState() {
        clearLog();
        try {
            const res = await fetch(`${WORKER_URL}/state`);
            const data = await res.json();
            if (data.messages && data.messages.length) {
                const maxId = Math.max(...data.messages.map(m => m.id), 0);
                lastMessageId = maxId;
            }
        } catch(e) { console.warn(e); }
    }
    
    async function handlePlayerDeath() {
        gameActive = false;
        gameOver = true;
        addLog(`💀 ${currentPlayer.name} 已经死亡，游戏结束。`, "system", false);
        document.getElementById("actBtn").disabled = true;
        document.getElementById("actionInput").disabled = true;
        document.getElementById("turnIndicator").innerHTML = "💀 游戏结束";
    }
    
    document.getElementById("createPlayerBtn").onclick = async () => {
        const name = document.getElementById("playerName").value.trim();
        const cls = document.getElementById("playerClass").value;
        if (!name) { alert("请输入名字"); return; }
        const attributes = { ...pendingAttributes };
        let skills = [];
        let inventory = [{ name: "治疗药水", quantity: 2 }];
        if (cls === "战士") skills = ["破甲斩"];
        else if (cls === "法师") skills = ["火球术"];
        else if (cls === "游侠") skills = ["精准射击"];
        
        const res = await api("createPlayer", { name, class: cls, attributes, skills, inventory });
        if (res.success) {
            currentPlayer = res.player;
            localStorage.setItem("playerId", currentPlayer.id);
            document.getElementById("playerNameDisplay").innerHTML = `${currentPlayer.name} (${currentPlayer.class})`;
            addLog(`欢迎，${currentPlayer.name}！`, "system", true);
            updateInventoryUI();
            showPanel("room");
            await refreshState();
        } else {
            alert("创建失败");
        }
    };
    
    document.getElementById("restoreBtn").onclick = async () => {
        const id = document.getElementById("restoreId").value.trim();
        if (!id) { alert("请输入角色ID"); return; }
        const res = await api("getPlayer", { playerId: id });
        if (res.success && res.player) {
            currentPlayer = res.player;
            localStorage.setItem("playerId", currentPlayer.id);
            document.getElementById("playerNameDisplay").innerHTML = `${currentPlayer.name} (${currentPlayer.class})`;
            addLog(`欢迎回来，${currentPlayer.name}！`, "system", true);
            updateInventoryUI();
            showPanel("room");
            await refreshState();
        } else {
            alert("角色不存在或已过期");
        }
    };
    
    async function refreshState() {
        const res = await fetch(`${WORKER_URL}/state`);
        const data = await res.json();
        if (currentPlayer && data.players[currentPlayer.id]) {
            currentPlayer = data.players[currentPlayer.id];
            updateInventoryUI();
            if (currentPlayer.hp <= 0 && !gameOver) {
                await handlePlayerDeath();
            }
        }
        if (currentPlayer && currentPlayer.roomId && data.rooms[currentPlayer.roomId]) {
            currentRoom = data.rooms[currentPlayer.roomId];
            if (currentRoom.status === "playing" && !gameActive && !gameOver) {
                gameActive = true;
                showPanel("game");
                renderGameUI();
                if (currentRoom.currentScene && !window._sceneShown) {
                    addLog(currentRoom.currentScene, "ai", true);
                    window._sceneShown = true;
                }
            } else if (currentRoom.status === "waiting") {
                renderRoomUI();
            } else if (gameActive && !gameOver) {
                renderGameUI();
            }
        } else {
            document.getElementById("roomInfo").innerHTML = "<div>暂无房间</div>";
            document.getElementById("roomPlayerList").innerHTML = "";
            document.getElementById("roomActions").innerHTML = `<button id="createRoomBtn">➕ 创建新房间</button>`;
            document.getElementById("createRoomBtn")?.addEventListener("click", createRoom);
        }
    }
    
    async function createRoom() {
        const res = await api("createRoom", { roomName: `${currentPlayer.name}的房间`, playerId: currentPlayer.id });
        if (res.success) {
            currentRoom = res.room;
            await resetRoomState();
            await refreshState();
        } else {
            alert("创建失败: " + (res.error || "未知错误"));
        }
    }
    
    async function joinRoom() {
        const code = document.getElementById("joinRoomCode").value.trim().toUpperCase();
        if (!code) return;
        const res = await api("joinRoom", { roomId: code, playerId: currentPlayer.id });
        if (res.success) {
            currentRoom = res.room;
            await resetRoomState();
            await refreshState();
        } else {
            alert("加入失败: " + res.error);
        }
    }
    
    async function setReady() {
        const newReady = !currentPlayer.isReady;
        const res = await api("playerReady", { playerId: currentPlayer.id, isReady: newReady });
        if (res.success) {
            currentPlayer.isReady = newReady;
            await refreshState();
        }
    }
    
    async function startGame() {
        const res = await api("startGame", { roomId: currentRoom.id, playerId: currentPlayer.id });
        if (res.success) {
            currentRoom = res.room;
            gameActive = true;
            window._sceneShown = false;
            showPanel("game");
            renderGameUI();
            const intro = await generateRandomOpening();
            addLog(intro, "ai", false);
            addLog("你可以行动。", "system", false);
        } else {
            alert("开始失败: " + res.error);
        }
    }
    
    function renderRoomUI() {
        if (!currentRoom) return;
        const isHost = currentRoom.hostId === currentPlayer.id;
        document.getElementById("roomInfo").innerHTML = `<div class="room-code">🏠 房间码: ${currentRoom.id}</div><div>状态: 等待中</div>`;
        fetch(`${WORKER_URL}/state`).then(r=>r.json()).then(data=>{
            const playersData = data.players;
            let html = "";
            for (let pid of currentRoom.players) {
                const p = playersData[pid];
                if (p) {
                    html += `<div class="player-card ${p.isReady ? 'ready' : ''} ${pid === currentRoom.hostId ? 'host' : ''}">${p.name} (${p.class}) ${p.isReady ? '✓' : '○'}</div>`;
                }
            }
            document.getElementById("roomPlayerList").innerHTML = html || "<div>等待玩家...</div>";
        });
        document.getElementById("roomActions").innerHTML = `<button id="readyBtn" style="margin-bottom: 8px;">${currentPlayer.isReady ? '取消准备' : '准备就绪'}</button>${isHost ? `<button id="startGameBtn">开始游戏</button>` : '<div class="info-text">等待房主开始...</div>'}`;
        document.getElementById("readyBtn")?.addEventListener("click", setReady);
        document.getElementById("startGameBtn")?.addEventListener("click", startGame);
    }
    
    function renderGameUI() {
        if (!currentRoom) return;
        if (gameOver) {
            document.getElementById("turnIndicator").innerHTML = "💀 游戏结束";
            document.getElementById("actBtn").disabled = true;
            document.getElementById("actionInput").disabled = true;
            return;
        }
        const isPlayerTurn = currentRoom.phase === "player";
        const myTurn = isPlayerTurn && currentRoom.turn === currentPlayer.id;
        const canAct = myTurn && gameActive && !isActing;
        document.getElementById("turnIndicator").innerHTML = isPlayerTurn 
            ? (myTurn ? "🎲 轮到你了！" : "⏳ 等待其他玩家...")
            : "⚔️ 敌人回合...";
        document.getElementById("sceneDesc").innerHTML = currentRoom.currentScene || "冒险继续...";
        const enemyDiv = document.getElementById("enemyContainer");
        if (currentRoom.enemies && currentRoom.enemies.length > 0) {
            enemyDiv.innerHTML = currentRoom.enemies.map(e => `<div class="enemy-card"><span>👾 ${e.name}</span><span>❤️ ${e.hp}/${e.maxHp}</span></div>`).join("");
        } else {
            enemyDiv.innerHTML = "<div>⚔️ 当前没有敌人，你可以探索或对话。</div>";
        }
        document.getElementById("playerStats").innerHTML = `<strong>${currentPlayer.name}</strong> (${currentPlayer.class}) | ❤️ ${currentPlayer.hp}/${currentPlayer.maxHp} | 💙 MP ${currentPlayer.mp}/${currentPlayer.maxMp} | 💪${currentPlayer.attributes.str} 🏹${currentPlayer.attributes.dex} 🧠${currentPlayer.attributes.int} ❤️${currentPlayer.attributes.con}`;
        const actionInput = document.getElementById("actionInput");
        const actBtn = document.getElementById("actBtn");
        if (actionInput) actionInput.disabled = !canAct;
        if (actBtn) actBtn.disabled = !canAct;
        updateInventoryUI();
    }
    
    async function executeNPCTurn() {
        if (gameOver) return;
        addLog("⚔️ 敌人开始行动...", "system", false);
        if (currentRoom.enemies && currentRoom.enemies.length > 0) {
            const stateRes = await fetch(`${WORKER_URL}/state`);
            const stateData = await stateRes.json();
            const playersData = stateData.players;
            const enemies = currentRoom.enemies;
            let updates = {};
            for (let enemy of enemies) {
                const alivePlayers = currentRoom.players.filter(pid => playersData[pid] && playersData[pid].hp > 0);
                if (alivePlayers.length === 0) break;
                const targetId = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                const target = playersData[targetId];
                const damage = Math.floor(Math.random() * 12) + 6;
                target.hp = Math.max(0, target.hp - damage);
                updates[targetId] = target;
                addLog(`${enemy.name} 攻击 ${target.name}，造成 ${damage} 伤害！`, "damage", false);
                if (target.hp <= 0) {
                    addLog(`💀 ${target.name} 死亡！`, "damage", false);
                    if (targetId === currentPlayer.id) {
                        await handlePlayerDeath();
                        return;
                    }
                }
            }
            for (let pid in updates) {
                await api("updatePlayer", { playerId: pid, updates: { hp: updates[pid].hp } });
                if (pid === currentPlayer.id) currentPlayer.hp = updates[pid].hp;
            }
        } else {
            const history = getLogHistory();
            const lastEvents = history.slice(-5).map(h => h.content).join(" ");
            const prompt = `当前场景：${currentRoom.currentScene || "冒险中"}。最近事件：${lastEvents}。生成一段简短的剧情推进，直接描述变化，不要引入新敌人，不要绕弯子。40字以内。`;
            const narrative = await generateNarrative(prompt);
            addLog(narrative, "ai", false);
            await api("updateGame", { roomId: currentRoom.id, currentScene: narrative });
        }
        if (!gameOver) {
            const firstPlayer = currentRoom.players[0];
            await api("updateGame", { roomId: currentRoom.id, turn: firstPlayer, phase: "player" });
            await refreshState();
            addLog("轮到玩家回合！", "system", false);
        }
    }
    
    async function takeAction() {
        if (isActing || gameOver) { addLog("请等待...", "system", true); return; }
        
        const stateRes = await fetch(`${WORKER_URL}/state`);
        const stateData = await stateRes.json();
        if (stateData.rooms && currentPlayer.roomId && stateData.rooms[currentPlayer.roomId]) {
            currentRoom = stateData.rooms[currentPlayer.roomId];
        } else {
            addLog("无法获取房间状态，请刷新页面", "system", true);
            return;
        }
        
        if (!currentRoom || currentRoom.phase !== "player") { addLog("现在是敌人回合，请稍后", "system", true); return; }
        if (currentRoom.turn !== currentPlayer.id) { addLog("还没轮到你", "system", true); return; }
        const actionText = document.getElementById("actionInput").value;
        if (!actionText) { addLog("请输入行动", "system", true); return; }
        
        addLog(`🎯 ${currentPlayer.name} 行动：${actionText}`, "action", false);
        
        isActing = true;
        document.getElementById("actBtn").disabled = true;
        document.getElementById("actionInput").disabled = true;
        try {
            const lower = actionText.toLowerCase();
            let isCombat = false;
            let target = null;
            let skillUsed = null;
            let itemUsed = null;
            
            if (currentPlayer.skills) {
                for (let skill of currentPlayer.skills) {
                    if (lower.includes(skill.toLowerCase())) {
                        skillUsed = skill;
                        break;
                    }
                }
            }
            if (lower.includes("使用治疗药水") || lower.includes("喝治疗药水")) {
                itemUsed = "治疗药水";
                if (!useItem(itemUsed)) {
                    addLog(`无法使用 ${itemUsed}，你没有该物品或数量不足。`, "system", false);
                    isActing = false;
                    renderGameUI();
                    document.getElementById("actionInput").value = "";
                    return;
                }
            }
            
            if (currentRoom.enemies && currentRoom.enemies.length > 0) {
                if (lower.includes("攻击") || lower.includes("砍") || lower.includes("打") || lower.includes("射") || skillUsed) {
                    isCombat = true;
                    target = currentRoom.enemies[0];
                }
            }
            
            if (isCombat && target) {
                let dice = Math.floor(Math.random() * 20) + 1;
                let attackRoll = dice + currentPlayer.atkBonus;
                let isHit = attackRoll >= (target.ac || 11);
                let damage = 0;
                let mpCost = 0;
                let skillBonus = 0;
                if (skillUsed) {
                    const skillResult = useSkill(skillUsed);
                    if (!skillResult) {
                        addLog(`技能 ${skillUsed} 不可用或MP不足。`, "system", false);
                        isActing = false;
                        renderGameUI();
                        return;
                    }
                    skillBonus = skillResult.damageBonus;
                    mpCost = skillResult.mpCost;
                    addLog(`使用技能 ${skillUsed}，消耗 ${mpCost} MP。`, "system", false);
                }
                if (isHit) {
                    let base = currentPlayer.baseDmg + (skillBonus || 0);
                    damage = Math.floor(Math.random() * base) + 5 + Math.floor(currentPlayer.attributes.str / 2);
                    target.hp -= damage;
                    if (target.hp < 0) target.hp = 0;
                }
                addLog(`${currentPlayer.name} 掷出 ${dice}，攻击加值 ${currentPlayer.atkBonus}，合计 ${attackRoll} vs AC ${target.ac || 11} → ${isHit ? "命中" : "未命中"}`, "damage", false);
                if (isHit) addLog(`造成 ${damage} 点伤害，${target.name} 剩余 HP ${target.hp}/${target.maxHp}`, "damage", false);
                const newEnemies = currentRoom.enemies.filter(e => e.hp > 0);
                await api("updateGame", { roomId: currentRoom.id, enemies: newEnemies });
                const hitResult = isHit ? "命中" : "未命中";
                const aiDesc = await generateBattleDescription(currentPlayer.name, currentPlayer.class, actionText, isHit, damage, target.name, target.hp);
                addLog(aiDesc, "ai", false);
                if (newEnemies.length === 0) {
                    addLog("🏆 战斗胜利！", "ai", false);
                    const afterBattle = await generateNarrative("战斗结束后，描述场景的变化或新的发现。");
                    addLog(afterBattle, "ai", false);
                }
            } else {
                const prompt = `玩家 ${currentPlayer.name} (${currentPlayer.class}) 想要：${actionText}。当前场景：${currentRoom.currentScene || "未知场景"}。他的属性：力量${currentPlayer.attributes.str}，敏捷${currentPlayer.attributes.dex}，智力${currentPlayer.attributes.int}，体质${currentPlayer.attributes.con}。他拥有技能：${currentPlayer.skills.join(", ")}。物品：${currentPlayer.inventory ? currentPlayer.inventory.map(i=>`${i.name}×${i.quantity}`).join(", ") : "无"}。请判断行动合理性，直接描述结果（成功/失败/获得物品/触发战斗），简洁不绕弯子。`;
                const narrative = await generateNarrative(prompt);
                addLog(narrative, "ai", false);
                await api("updateGame", { roomId: currentRoom.id, currentScene: narrative });
                if (narrative.includes("获得") && (narrative.includes("药水") || narrative.includes("金币") || narrative.includes("武器"))) {
                    await addItemToInventory("治疗药水", 1);
                }
            }
            
            if (currentPlayer.hp <= 0) {
                await handlePlayerDeath();
                return;
            }
            
            const playerList = currentRoom.players;
            const currentIdx = playerList.indexOf(currentPlayer.id);
            if (currentIdx === -1) {
                await refreshState();
                return;
            }
            const nextIdx = (currentIdx + 1) % playerList.length;
            if (nextIdx === 0) {
                await api("updateGame", { roomId: currentRoom.id, turn: null, phase: "npc" });
                await executeNPCTurn();
            } else {
                await api("updateGame", { roomId: currentRoom.id, turn: playerList[nextIdx] });
            }
            await refreshState();
            renderGameUI();
            document.getElementById("actionInput").value = "";
        } catch(e) {
            addLog("行动失败: " + e.message, "system", true);
        } finally {
            isActing = false;
            renderGameUI();
        }
    }
    
    async function syncLoop() {
        try {
            const res = await fetch(`${WORKER_URL}/state`);
            const data = await res.json();
            if (currentPlayer && data.players[currentPlayer.id]) {
                currentPlayer = data.players[currentPlayer.id];
                document.getElementById("playerNameDisplay").innerHTML = `${currentPlayer.name} (${currentPlayer.class})`;
                updateInventoryUI();
                if (currentPlayer.hp <= 0 && !gameOver) {
                    await handlePlayerDeath();
                }
            }
            if (currentPlayer && currentPlayer.roomId && data.rooms[currentPlayer.roomId]) {
                const newRoom = data.rooms[currentPlayer.roomId];
                if (JSON.stringify(currentRoom) !== JSON.stringify(newRoom)) {
                    currentRoom = newRoom;
                    if (currentRoom.status === "playing" && !gameActive && !gameOver) {
                        gameActive = true;
                        showPanel("game");
                        renderGameUI();
                        if (currentRoom.currentScene && !window._sceneShown) {
                            addLog(currentRoom.currentScene, "ai", true);
                            window._sceneShown = true;
                        }
                    } else if (currentRoom.status === "waiting") {
                        renderRoomUI();
                    } else if (gameActive && !gameOver) {
                        renderGameUI();
                    }
                }
            }
            if (data.messages && data.messages.length) {
                for (let msg of data.messages) {
                    if (msg.id > lastMessageId) {
                        lastMessageId = msg.id;
                        if (msg.playerName !== currentPlayer?.name) {
                            addLog(msg.content, msg.type, true, msg.id);
                        } else {
                            displayedMessageIds.add(msg.id);
                        }
                    }
                }
            }
            document.getElementById("syncStatus").innerHTML = "🟢 已连接";
        } catch(e) {
            console.error(e);
            document.getElementById("syncStatus").innerHTML = "🔴 离线";
        }
    }
    
    document.getElementById("joinRoomBtn").onclick = joinRoom;
    document.getElementById("actBtn").onclick = takeAction;
    document.getElementById("actionInput").addEventListener("keypress", (e) => { if (e.key === "Enter" && !isActing && !gameOver) { e.preventDefault(); takeAction(); } });
    initAttributeControls();
    syncInterval = setInterval(syncLoop, 1000);
    showPanel("login");
    addLog("🎲 欢迎来到 AI 跑团！创建角色并分配属性点。", "system", true);
    if (!GROQ_API_KEY || GROQ_API_KEY === "gsk_你的GroqKey") {
        addLog("⚠️ 未配置 Groq API Key，AI 描述将使用简化模式。请在代码中填入你的 Key。", "system", true);
    } else {
        addLog("✅ Groq API Key 已配置，AI 主持人已就绪！", "system", true);
    }
</script>
</body>
</html>
